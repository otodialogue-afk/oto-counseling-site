<style>
  :root{

    --ink: #2a2620;
    --line: rgba(248,244,236,0.18);

  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--green);
    color: var(--cream);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", sans-serif;
    line-height: 1.9;
  }

    margin: 0 auto;

  header .brand{ font-size: 22px; letter-spacing: 0.1em; margin: 0; }
  header .brand .en{ font-size: 15px; color: var(--cream-muted); margin-left: 4px; }
  .back{
    display: block;
    text-align: center;
    font-size: 13px;
    padding: 16px 0 8px;
    color: var(--cream-muted);
  }
  h1{
    font-size: 19px;
    text-align: center;
    margin: 24px 0 20px;
    color: var(--cream);
  }
  .cta-button{
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
    padding: 16px 24px;
    background: var(--cream);
    color: var(--green);
    text-align: center;
    text-decoration: none;
    border-radius: 6px;
    font-size: 15px;
    letter-spacing: 0.08em;
  }
